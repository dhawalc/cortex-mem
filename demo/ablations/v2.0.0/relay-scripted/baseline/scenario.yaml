schema_version: 1
id: durable-webhook-relay-7319
title: Durable webhook relay handoff
seed: 7319
repository: repository
summary: >-
  Harden a tiny Python webhook relay across a cold-start planner, implementer,
  and reviewer handoff. Runtime constraints are intentionally absent from the
  service repository.

stages:
  planner:
    agent_id: relay-planner
    prompt: >-
      Plan the durable webhook relay task in this repository. Recall relevant
      AOMS context before consequential work, then leave durable project state
      for the next cold-start agent. Begin every AOMS handoff memory with a
      compact synopsis of all recalled runtime constraints so their identifying
      terms survive a 1000-token downstream packed-context limit.
  implementer:
    agent_id: relay-implementer
    prompt: >-
      Implement the durable webhook relay task in this repository. Recall
      relevant AOMS context before editing, run the repository tests, and leave
      the workspace ready for independent review. Make the final recall before
      editing an evidence recall using a constraint-focused task query and the
      fact kind, so its packed context carries every runtime constraint. Before
      finishing, remember one workspace-scoped fact whose opening is a compact,
      complete synopsis of every recalled runtime constraint. Preserve each
      constraint's identifying terminology, not merely the implementation
      mechanism, so the fact is a self-sufficient handoff under the reviewer's
      1000-token packed-context limit.
    recall_query: >-
      relay dispatch constraints event header retries ordering tokens recursive
      redaction nested lists
    token_ceiling: 1000
  reviewer:
    agent_id: relay-reviewer
    prompt: >-
      Independently review and finish the durable webhook relay task in this
      repository. Recall relevant AOMS context before reviewing, fix any issue
      you find, and leave a verified final workspace. Make the final recall
      before review an evidence recall using a constraint-focused task query and
      the fact and failure kinds, so its packed context carries the runtime
      constraints and the private reviewer regression clue.
    recall_query: relay dispatch constraints regression sqlite retries ordering tokens
    token_ceiling: 1000

constraints:
  - memory_id: relay-constraint-durable-idempotency
    text: >-
      RELAY CONSTRAINT: Use X-Relay-Event as the idempotency key and persist it
      before acknowledging. A retry after process restart must return duplicate
      without replacing the original event.
    key_phrases:
      - [X-Relay-Event]
      - [process restart, restart, reopening an existing file]
      - [original event, original payload, pre-existing row untouched]
  - memory_id: relay-constraint-stable-order
    text: >-
      RELAY CONSTRAINT: Events sharing a received_at timestamp must remain in
      first-accepted ingestion order; never sort by caller event ID.
    key_phrases:
      - [received_at]
      - [ingestion order, insertion order]
      - [caller event ID, event_id]
  - memory_id: relay-constraint-recursive-redaction
    text: >-
      RELAY CONSTRAINT: Recursively replace values for payload keys ending in
      _token before bytes reach durable storage, including keys in nested lists.
    key_phrases:
      - [recursive, recursively]
      - [_token]
      - [nested lists, lists/tuples, dicts inside lists]
      - [durable storage, before serialization, before bytes reach]

tempting_wrong_approach:
  memory_id: relay-decision-reject-memory-dedupe
  text: >-
    PLANNER DECISION: Reject the tempting module-level seen-ID set plus
    lexicographic event sorting. It passes the public unit tests but loses
    idempotency on restart and violates acceptance order.

regression_clue:
  memory_id: relay-regression-insert-replace
  text: >-
    STAGE 3 REGRESSION CLUE: SQLite INSERT OR REPLACE deletes and reinserts the
    row, which can change its sequence and overwrite the original retry body.
    Preserve the first row with INSERT OR IGNORE and read back its status.
  key_phrases:
    - [INSERT OR REPLACE]
    - [original retry body, original row, original payload]
    - [sequence, seq]

canaries:
  - memory_id: relay-canary-planner-private
    owner_agent_id: relay-planner
    workspace_id: relay-gauntlet
    scope: agent-private
    text: PLANNER_ONLY_CANARY::cobalt-lantern-7319
  - memory_id: relay-canary-foreign-workspace
    owner_agent_id: relay-outsider
    workspace_id: unrelated-customer
    scope: workspace
    text: FOREIGN_WORKSPACE_CANARY::violet-otter-7319

artifacts:
  stage_2_recall: stage-2/recall.json
  stage_3_recall: stage-3/recall.json
  completed_repository: workspace

acceptance_tests:
  - durable idempotency survives a new RelayStore process instance
  - equal timestamps retain first-accepted sequence
  - nested *_token values never reach the SQLite file
  - a duplicate cannot replace the original event payload

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan (working tree and diff)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out full repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pinned gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          bin_dir="$RUNNER_TEMP/gitleaks-bin"
          curl -fsSL \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            -o "$archive"
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  $archive" \
            | sha256sum -c -
          mkdir -p "$bin_dir"
          tar -xzf "$archive" -C "$bin_dir" gitleaks
          echo "$bin_dir" >> "$GITHUB_PATH"

      - name: Scan checked-out working tree
        run: gitleaks dir . --config .gitleaks.toml --redact --no-banner

      - name: Select event diff base
        id: diff-base
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          elif [[ -n "$BEFORE_SHA" && "$BEFORE_SHA" != "$zero" ]] \
            && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            base="$BEFORE_SHA"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            base="$(git rev-parse HEAD^)"
          else
            base="$(git hash-object -t tree /dev/null)"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Scan event diff
        shell: bash
        env:
          DIFF_BASE: ${{ steps.diff-base.outputs.base }}
        run: |
          set -euo pipefail
          git diff --no-ext-diff --unified=0 "$DIFF_BASE" "$GITHUB_SHA" \
            | sed -n '/^+++ /d; /^+/p' \
            | gitleaks stdin --config .gitleaks.toml --redact --no-banner

  test:
    name: Tests (Python ${{ matrix.python-version }})
    needs: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and repository test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run canonical test suite
        run: python -m pytest

  wheel:
    name: Wheel and fresh-install acceptance
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build frontend
        run: python -m pip install --upgrade pip build

      - name: Build wheel
        run: python -m build --wheel

      - name: Install wheel in a clean virtual environment
        shell: bash
        run: |
          set -euo pipefail
          wheel_path="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$wheel_path"
          python -m venv "$RUNNER_TEMP/aoms-wheel-venv"
          "$RUNNER_TEMP/aoms-wheel-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/aoms-wheel-venv/bin/python" -m pip install "$wheel_path"

      - name: Run fresh-wheel acceptance round-trip
        shell: bash
        env:
          AOMS_EMBEDDING_PROVIDER: none
          AOMS_AGENT_ID: ci-wheel-agent
          AOMS_WORKSPACE: ci-wheel-workspace
        run: |
          set -euo pipefail
          cli="$RUNNER_TEMP/aoms-wheel-venv/bin/cortex-mem"
          source_dir="$RUNNER_TEMP/aoms-source"
          export_dir="$RUNNER_TEMP/aoms-export"
          restored_dir="$RUNNER_TEMP/aoms-restored"

          "$cli" init --data-dir "$source_dir"
          "$cli" doctor --data-dir "$source_dir"
          "$cli" import tests/v2/fixtures/corpus --data-dir "$source_dir"
          "$cli" export "$export_dir" --data-dir "$source_dir"
          "$cli" restore "$export_dir" --data-dir "$restored_dir"
          "$cli" doctor --data-dir "$restored_dir" | tee "$RUNNER_TEMP/restored-doctor.txt"
          grep -F "5 canonical records" "$RUNNER_TEMP/restored-doctor.txt"

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: cortex-mem-wheel
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 14

  offline-harnesses:
    name: Offline eval and scripted relay
    needs: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      AOMS_EMBEDDING_PROVIDER: none
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run deterministic retrieval evaluation matrix
        run: python -m aoms.eval run --records 78 --output-dir "$RUNNER_TEMP/aoms-eval-runs"

      - name: Run and validate scripted relay fixture
        run: |
          python -m demo.relay.runner run \
            --output "$RUNNER_TEMP/aoms-relay" \
            --agents scripted,scripted,scripted \
            --seed 7319 \
            --with-baseline
          python -m demo.relay.runner validate "$RUNNER_TEMP/aoms-relay"

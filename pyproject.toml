[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cortex-mem"
dynamic = ["version"]
description = "Local-first shared memory for MCP agent fleets"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "dhawalc", email = "dhawal@example.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "chromadb>=0.4.0",
    "aiosqlite>=0.19.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "platformdirs>=4.0",
    "tiktoken>=0.7.0",
    "fastembed>=0.7.0,<0.9",
    "sqlite-vec>=0.1.6,<0.2",
    "httpx>=0.27.0",
    "mcp>=1.29,<2",
    "click>=8.1",
]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
cortex-mem = "aoms.cli:main"

[project.urls]
Homepage = "https://github.com/dhawalc/cortex-mem"
Repository = "https://github.com/dhawalc/cortex-mem"
Issues = "https://github.com/dhawalc/cortex-mem/issues"

[tool.setuptools.dynamic]
version = {attr = "aoms.version.__version__"}

[tool.setuptools.packages.find]
include = ["aoms*"]
exclude = ["tests*", "scripts*", "snapshots*", "index*"]

[tool.setuptools.data-files]
"share/cortex-mem/tests/v2" = ["tests/v2/test_mcp_server.py"]
"share/cortex-mem/tests/v2/fixtures" = [
    "tests/v2/fixtures/mcp_tool_schemas.snapshot.json",
]
